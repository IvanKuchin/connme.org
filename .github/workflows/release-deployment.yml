---
#########################
#########################
## Deploy Docker Image ##
#########################
#########################

#
# Documentation:
# https://help.github.com/en/articles/workflow-syntax-for-github-actions
#

name: Release deployment

#######################################
# Start the job on all push to master #
#######################################
on:
  release:
    types: ['published']

###############
# Set the Job #
###############
jobs:
  build:
    # Name the Job
    name: job 1
    # Set the agent to run on
    runs-on: ubuntu-latest
    environment: release
    # Only run this on the main repo
    # if: github.repository == 'github/super-linter'

    #########################################################################################
    # Do not use startegy for containers building.                                          #
    # All containers will build in parallel, rather than use cache and same dynamic linking #
    #########################################################################################
    #strategy:
    #  matrix:
    #    container: [app, cron, chat]

    ##################
    # Load all steps #
    ##################
    steps:
     #############################
     # Init deployment variables #
     #############################
      - name: init deploymnet variables
        id: set_variables
        run: |
          BUILD_RELEASE="${GITHUB_REF#refs/tags/}"
          BUILD_RELEASE_MAJOR="$(echo "${GITHUB_REF%%.*}" | awk -F/ '{ print $3; }')"
          BUILD_RELEASE_NUMBER="${GITHUB_REF#refs/tags/v}"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          BUILD_REPO="$(echo "${GITHUB_REPOSITORY}" | awk -F/ '{ print $2; }')"

          echo "BUILD_RELEASE=$BUILD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "BUILD_RELEASE_MAJOR=$BUILD_RELEASE_MAJOR" >> "$GITHUB_OUTPUT"
          echo "BUILD_RELEASE_NUMBER=$BUILD_RELEASE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "BUILD_REPO=$BUILD_REPO" >> "$GITHUB_OUTPUT"
      - name: print deploymnet variables
        run: |
          echo $BUILD_RELEASE
          echo $BUILD_RELEASE_MAJOR
          echo $BUILD_RELEASE_NUMBER
          echo $BUILD_DATE
          echo $BUILD_REPO
        env:
          BUILD_RELEASE: ${{ steps.set_variables.outputs.BUILD_RELEASE }}
          BUILD_RELEASE_MAJOR: ${{ steps.set_variables.outputs.BUILD_RELEASE_MAJOR }}
          BUILD_RELEASE_NUMBER: ${{ steps.set_variables.outputs.BUILD_RELEASE_NUMBER }}
          BUILD_DATE: ${{ steps.set_variables.outputs.BUILD_DATE }}
          BUILD_REPO: ${{ steps.set_variables.outputs.BUILD_REPO }}

      ##########################
      # Checkout the code base #
      ##########################
      - name: Checkout Code
        uses: actions/checkout@v5

      ########################
      # Setup Docker build X #
      ########################
      - name: Setup BuildX
        uses: docker/setup-buildx-action@v3

      ###############################
      # Login to DockerHub registry #
      ###############################
      #- name: Login to DockerHub
      #  uses: docker/login-action@v3
      #  with:
      #    username: ${{ secrets.DOCKER_USERNAME }}
      #    password: ${{ secrets.DOCKER_PASSWORD }}

      ######################################
      # Login to GitHub Container registry #
      ######################################
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ####################################
      # Replace variables in Dockerfiles #
      ####################################
      # - name: Replace variables in Dockerfiles
      #    run: |
      #      find ./supplemental/docker/ -name Dockerfile* | xargs -I % sed -i -e 's/__BUILD_REPO__/${{ steps.set_variables.outputs.BUILD_REPO }}/' %

      ###########################################
      # Build and Push containers to registries #
      ###########################################
      - name: Build and push
        if: success()
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./supplemental/docker/prod/Dockerfile
          build-args: |
            BUILD_DATE=${{ steps.set_variables.outputs.BUILD_DATE }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_VERSION=${{ github.sha }}
            BUILD_REPO=${{ steps.set_variables.outputs.BUILD_REPO }}
            BUILD_RELEASE_NUMBER=${{ steps.set_variables.outputs.BUILD_RELEASE_NUMBER }}
          target: app
          push: true
          tags: |
            ghcr.io/ivankuchin/${{ steps.set_variables.outputs.BUILD_REPO }}-app:${{ steps.set_variables.outputs.BUILD_RELEASE }}
            ghcr.io/ivankuchin/${{ steps.set_variables.outputs.BUILD_REPO }}-app:${{ steps.set_variables.outputs.BUILD_RELEASE_MAJOR }}
            ghcr.io/ivankuchin/${{ steps.set_variables.outputs.BUILD_REPO }}-app:latest

      - name: Build and push
        if: success()
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./supplemental/docker/prod/Dockerfile
          build-args: |
            BUILD_DATE=${{ steps.set_variables.outputs.BUILD_DATE }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_VERSION=${{ github.sha }}
            BUILD_REPO=${{ steps.set_variables.outputs.BUILD_REPO }}
            BUILD_RELEASE_NUMBER=${{ steps.set_variables.outputs.BUILD_RELEASE_NUMBER }}
          target: cron
          push: true
          tags: |
            ghcr.io/ivankuchin/${{ steps.set_variables.outputs.BUILD_REPO }}-cron:${{ steps.set_variables.outputs.BUILD_RELEASE }}
            ghcr.io/ivankuchin/${{ steps.set_variables.outputs.BUILD_REPO }}-cron:${{ steps.set_variables.outputs.BUILD_RELEASE_MAJOR }}
            ghcr.io/ivankuchin/${{ steps.set_variables.outputs.BUILD_REPO }}-cron:latest

      - name: Build and push
        if: success()
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./supplemental/docker/prod/Dockerfile
          build-args: |
            BUILD_DATE=${{ steps.set_variables.outputs.BUILD_DATE }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_VERSION=${{ github.sha }}
            BUILD_REPO=${{ steps.set_variables.outputs.BUILD_REPO }}
            BUILD_RELEASE_NUMBER=${{ steps.set_variables.outputs.BUILD_RELEASE_NUMBER }}
          target: uploaders
          push: true
          tags: |
            ghcr.io/ivankuchin/${{ steps.set_variables.outputs.BUILD_REPO }}-uploaders:${{ steps.set_variables.outputs.BUILD_RELEASE }}
            ghcr.io/ivankuchin/${{ steps.set_variables.outputs.BUILD_REPO }}-uploaders:${{ steps.set_variables.outputs.BUILD_RELEASE_MAJOR }}
            ghcr.io/ivankuchin/${{ steps.set_variables.outputs.BUILD_REPO }}-uploaders:latest


